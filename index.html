<title>CoreTech Nexus</title>

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  :root{
    --bg: #0A0E13;
    --bg-2: #0E141C;
    --panel: #10161F;
    --panel-border: #1E2A37;
    --trace: #1A2733;
    --text: #E7EEF5;
    --muted: #7E8FA3;
    --muted-dim: #4D5C6E;
    --accent: #3FE0D0;
    --accent-dim: #1F6E68;
    --accent-2: #FF8F4C;
    --focus: #6FE9DC;
  }

  *{ box-sizing: border-box; }
  html,body{ margin:0; padding:0; }

  body{
    background: radial-gradient(ellipse 120% 90% at 50% -10%, #0F1922 0%, var(--bg) 55%, #07090D 100%);
    color: var(--text);
    font-family: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 6vh 1.5rem;
    overflow-x: hidden;
    position: relative;
  }

  canvas#net{
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    opacity: 0.55;
  }

  .stage{
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 30rem;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    gap: 2.1rem;
  }

  /* --- logo --- */
  .brand{
    display: flex;
    justify-content: center;
  }

  .logo-plate{
    display: inline-flex;
    align-items: center;
    background: linear-gradient(180deg, #FFFFFF 0%, #F2F6F7 100%);
    border-radius: 12px;
    padding: 1rem 1.5rem;
    box-shadow:
      0 20px 45px -22px rgba(0,0,0,0.55),
      0 0 0 1px rgba(255,255,255,0.05),
      0 0 46px rgba(63, 224, 208, 0.16);
  }

  .logo-plate img{
    display: block;
    width: min(230px, 62vw);
    height: auto;
  }

  /* --- panel --- */
  .panel{
    width: 100%;
    background: linear-gradient(180deg, var(--panel) 0%, var(--bg-2) 100%);
    border: 1px solid var(--panel-border);
    border-radius: 10px;
    padding: 2.6rem 2.2rem 2.2rem;
    box-shadow: 0 30px 70px -30px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,255,255,0.03);
  }

  .status-row{
    display: inline-flex;
    align-items: center;
    gap: 0.55rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.72rem;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 1.3rem;
  }

  .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 0 0 rgba(63,224,208, 0.6);
    animation: pulse 1.8s ease-out infinite;
  }
  @media (prefers-reduced-motion: reduce){ .dot{ animation: none; } }

  @keyframes pulse{
    0%   { box-shadow: 0 0 0 0 rgba(63,224,208, 0.55); }
    70%  { box-shadow: 0 0 0 7px rgba(63,224,208, 0); }
    100% { box-shadow: 0 0 0 0 rgba(63,224,208, 0); }
  }

  h1{
    font-family: "Chakra Petch", "IBM Plex Sans", sans-serif;
    font-weight: 700;
    font-size: clamp(1.7rem, 6vw, 2.15rem);
    line-height: 1.18;
    margin: 0 0 0.9rem;
    text-wrap: balance;
  }

  .lede{
    font-size: 0.97rem;
    line-height: 1.6;
    color: var(--muted);
    margin: 0 0 2rem;
    max-width: 30ch;
    margin-inline: auto;
  }

  .divider{
    height: 1px;
    background: repeating-linear-gradient(90deg, var(--trace) 0 6px, transparent 6px 10px);
    margin: 0 0 1.7rem;
  }

  .contact{
    display: flex;
    flex-direction: column;
    gap: 0.9rem;
  }

  .contact-row{
    display: flex;
    align-items: baseline;
    justify-content: center;
    gap: 0.7rem;
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.86rem;
  }

  .contact-label{
    color: var(--muted-dim);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 0.68rem;
    min-width: 3.4rem;
    text-align: right;
  }

  .contact-row a{
    color: var(--text);
    text-decoration: none;
    border-bottom: 1px solid var(--trace);
    padding-bottom: 1px;
    transition: color 0.15s ease, border-color 0.15s ease;
  }
  .contact-row a:hover,
  .contact-row a:focus-visible{
    color: var(--accent);
    border-color: var(--accent-dim);
  }
  .contact-row a:focus-visible{ outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 2px; }

  footer{
    font-family: "IBM Plex Mono", monospace;
    font-size: 0.68rem;
    letter-spacing: 0.08em;
    color: var(--muted-dim);
    text-transform: uppercase;
  }
</style>

<script>
(function(){
  var canvas = document.getElementById('net');
  var ctx = canvas.getContext('2d');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var W, H, nodes, raf;

  function size(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function init(){
    size();
    var count = Math.max(18, Math.min(42, Math.floor((W*H)/55000)));
    nodes = [];
    for(var i=0;i<count;i++){
      nodes.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vx: (Math.random()-0.5)*0.18,
        vy: (Math.random()-0.5)*0.18
      });
    }
  }

  function step(){
    ctx.clearRect(0,0,W,H);
    var maxDist = Math.min(W,H)*0.16 + 90;

    for(var i=0;i<nodes.length;i++){
      var n = nodes[i];
      if(!reduced){
        n.x += n.vx; n.y += n.vy;
        if(n.x < 0 || n.x > W) n.vx *= -1;
        if(n.y < 0 || n.y > H) n.vy *= -1;
      }
    }

    for(var i=0;i<nodes.length;i++){
      for(var j=i+1;j<nodes.length;j++){
        var a = nodes[i], b = nodes[j];
        var dx = a.x-b.x, dy = a.y-b.y;
        var d = Math.sqrt(dx*dx+dy*dy);
        if(d < maxDist){
          var alpha = (1 - d/maxDist) * 0.16;
          ctx.strokeStyle = 'rgba(63, 224, 208, ' + alpha + ')';
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }
    for(var i=0;i<nodes.length;i++){
      ctx.beginPath();
      ctx.arc(nodes[i].x, nodes[i].y, 1.6, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(63, 224, 208, 0.45)';
      ctx.fill();
    }

    if(!reduced) raf = requestAnimationFrame(step);
  }

  init();
  step();

  var resizeTimer;
  window.addEventListener('resize', function(){
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(function(){
      cancelAnimationFrame(raf);
      init();
      step();
    }, 150);
  });
})();
</script>
